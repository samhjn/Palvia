name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

jobs:
  build-ipa:
    name: Build unsigned IPA for sideload
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build archive without signing
        run: |
          xcodebuild archive \
            -project iClaw.xcodeproj \
            -scheme iClaw \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/iClaw.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/iClaw.xcarchive/Products/Applications/iClaw.app Payload/
          zip -r iClaw-unsigned.ipa Payload
          ls -lh iClaw-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iClaw-unsigned-ipa
          path: iClaw-unsigned.ipa
          retention-days: 30
