name: Palvia
options:
  bundleIdPrefix: com.iclaw
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - ja
    - ko
    - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    VERSIONING_SYSTEM: apple-generic
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"

targets:
  Palvia:
    type: application
    platform: iOS
    sources:
      - path: Palvia
        excludes:
          - Info.plist
          # Built-in skill packages are added as a single folder reference
          # below so the <slug>/SKILL.md tree is preserved in the bundle —
          # without this exclude, XcodeGen would flatten every nested file
          # to the bundle root and the three SKILL.md files would collide.
          - Resources/BuiltInSkills
      - path: Palvia/Resources/BuiltInSkills
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Palvia/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.iclaw.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ENABLE_PREVIEWS: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Palvia/Palvia-Bridging-Header.h
    postBuildScripts:
      - script: |
          PLIST="${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}"
          [ -f "${PLIST}" ] || exit 0
          COMMIT=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          DIRTY=false
          if ! git -C "${SRCROOT}" diff --quiet HEAD -- ':(exclude,glob)**/Info.plist' 2>/dev/null; then
            DIRTY=true
          fi
          if ! git -C "${SRCROOT}" diff --cached --quiet HEAD -- ':(exclude,glob)**/Info.plist' 2>/dev/null; then
            DIRTY=true
          fi
          /usr/libexec/PlistBuddy -c "Add :GitCommitHash string ${COMMIT}" "${PLIST}" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :GitCommitHash ${COMMIT}" "${PLIST}"
          /usr/libexec/PlistBuddy -c "Add :GitIsDirty bool ${DIRTY}" "${PLIST}" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :GitIsDirty ${DIRTY}" "${PLIST}"
        name: Stamp Git Info
        basedOnDependencyAnalysis: false
    entitlements:
      path: Palvia/Palvia.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.iclaw.app
    dependencies:
      - target: PalviaWidgets
      - target: PalviaShareExtension

  PalviaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PalviaWidgets
        excludes:
          - Info.plist
      - path: Palvia/Services/BackgroundKeepAlive/CronActivityAttributes.swift
    settings:
      base:
        INFOPLIST_FILE: PalviaWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.iclaw.app.widgets
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework

  PalviaShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PalviaShareExtension
        excludes:
          - Info.plist
          - PalviaShareExtension.entitlements
      - path: Palvia/Services/Share/SharedContainer.swift
      - path: Palvia/Services/Share/AgentSnapshot.swift
      - path: Palvia/Services/Share/HandoffManifest.swift
    settings:
      base:
        INFOPLIST_FILE: PalviaShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.iclaw.app.share
        PRODUCT_MODULE_NAME: PalviaShareExtension
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
    entitlements:
      path: PalviaShareExtension/PalviaShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iclaw.app
    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: UniformTypeIdentifiers.framework

  PalviaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PalviaTests
    dependencies:
      - target: Palvia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iclaw.tests
        ENABLE_TESTABILITY: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Palvia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Palvia"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

  PalviaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PalviaUITests
      - path: Palvia/AccessibilityIdentifiers.swift
    dependencies:
      - target: Palvia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iclaw.uitests
        TEST_TARGET_NAME: Palvia
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Palvia:
    build:
      targets:
        Palvia: all
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: Palvia.xctestplan
          defaultPlan: true
        - path: PalviaUITests.xctestplan
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
